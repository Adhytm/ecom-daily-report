# 抖音电商（抖店罗盘）适配器 —— 以规划 5.1 样例为基准，口径设定见 5.4
adapter_version: 1
platform_key: doudian
display_name: 抖音电商（抖店罗盘）

file_matching:
  extensions: [.csv, .xlsx, .xlsm, .xls, .tsv, .txt]
  encoding_candidates: [utf-8-sig, gb18030, utf-8]
  header_row: auto
  auto_header_hints: ["商品ID", "支付金额", "统计时间"]
  skip_footer: 0
  detect_keywords: ["抖店", "罗盘", "商品ID", "统计时间", "支付金额"]
  detect_weight: 1.0

column_map:
  "统计时间": stat_date
  "店铺名称": shop_name
  "商品ID": platform_product_code
  "商品名称": product_name
  "一级类目": category
  "支付金额": gmv
  "支付商品件数": paid_qty
  "退款金额": refund_amount
  "商品访客数": visitors
  "支付人数": buyers
  "推广消耗": ad_cost

column_aliases:
  gmv: ["成交金额", "支付总额"]
  paid_qty: ["支付件数"]
  stat_date: ["统计日期", "日期"]
  visitors: ["商品访客数UV", "访客数"]
  ad_cost: ["推广费用", "巨量千川消耗"]

required_columns: [stat_date, platform_product_code, gmv]
optional_columns: [shop_name, product_name, category, paid_qty,
                   refund_amount, visitors, buyers, ad_cost, order_qty]

transforms:
  stat_date:
    type: datetime
    formats: ["%Y-%m-%d %H:%M:%S", "%Y-%m-%d", "%Y/%m/%d", "%Y%m%d"]
    truncate_to: day
  gmv:
    type: money
    strip_chars: [",", "￥", "¥", " ", "\t", "元"]
    unit: yuan
    default: "0"
  refund_amount:
    type: money
    strip_chars: [",", "￥", "¥", " "]
    unit: yuan
    default: "0"
  paid_qty:
    type: integer
    strip_chars: [",", "件"]
    default: "0"
  visitors:
    type: integer
    strip_chars: [","]
    default: null
  buyers:
    type: integer
    strip_chars: [","]
    default: null
  ad_cost:
    type: money
    strip_chars: [",", "￥", "¥", " "]
    unit: yuan
    default: "0"
  platform_product_code:
    type: string
    strip_chars: [" ", "\t", "'"]
    trim: true

metric_semantics:
  gmv_basis: paid
  gmv_includes_shipping: false
  gmv_includes_tax: false
  refund_handling: separate
  net_amount_formula: "gmv - refund_amount"
  timezone: Asia/Shanghai
  grain: sku_day
  # 平台扣点比例（0.05 = 5%）。0 = 利润不含扣点；抖音常见 1%~5%，按经营类目实填
  platform_fee_rate: 0
  # 单件履约成本（快递 + 包材，元/件）。0 = 不计入利润
  fulfillment_cost_per_unit: 0

row_filters:
  - column: stat_date
    op: not_null
  - column: gmv
    op: numeric
  - column: product_name
    op: not_contains
    values: ["测试", "赠品"]

dedup:
  enabled: true
  keys: [stat_date, platform_key, platform_product_code, shop_code]
  strategy: sum
