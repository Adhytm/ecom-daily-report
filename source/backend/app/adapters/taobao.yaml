# 淘宝/天猫（生意参谋）适配器 —— 口径设定见规划 5.4
# 生意参谋商品效果导出为 GBK 编码 CSV，表头使用淘系真实字段名
adapter_version: 1
platform_key: taobao
display_name: 淘宝/天猫（生意参谋）

file_matching:
  extensions: [.csv, .xlsx, .xlsm, .xls, .tsv, .txt]
  encoding_candidates: [gb18030, gbk, utf-8-sig, utf-8]
  header_row: auto
  auto_header_hints: ["商品ID", "支付金额", "统计日期"]
  skip_footer: 0
  detect_keywords: ["生意参谋", "淘宝", "天猫", "统计日期", "支付金额"]
  detect_weight: 1.0

column_map:
  "统计日期": stat_date
  "店铺名称": shop_name
  "商品ID": platform_product_code
  "商品名称": product_name
  "一级类目": category
  "支付金额": gmv
  "支付件数": paid_qty
  "退款金额": refund_amount
  "商品访客数": visitors
  "支付买家数": buyers
  "推广花费": ad_cost

column_aliases:
  stat_date: ["统计时间", "日期"]
  gmv: ["支付总额", "成交金额"]
  paid_qty: ["支付商品件数", "商品件数"]
  buyers: ["支付新买家数", "支付人数"]
  visitors: ["访客数", "商品访问人数"]
  ad_cost: ["推广费用", "直通车花费"]
  category: ["类目", "叶子类目"]

required_columns: [stat_date, platform_product_code, gmv]
optional_columns: [shop_name, product_name, category, paid_qty,
                   refund_amount, visitors, buyers, ad_cost, order_qty]

transforms:
  stat_date:
    type: datetime
    formats: ["%Y-%m-%d %H:%M:%S", "%Y-%m-%d", "%Y/%m/%d", "%Y%m%d"]
    truncate_to: day
  gmv:
    type: money
    strip_chars: [",", "￥", "¥", " ", "\t", "元"]
    unit: yuan
    default: "0"
  refund_amount:
    type: money
    strip_chars: [",", "￥", "¥", " "]
    unit: yuan
    default: "0"
  paid_qty:
    type: integer
    strip_chars: [",", "件"]
    default: "0"
  visitors:
    type: integer
    strip_chars: [","]
    default: null
  buyers:
    type: integer
    strip_chars: [","]
    default: null
  ad_cost:
    type: money
    strip_chars: [",", "￥", "¥", " "]
    unit: yuan
    default: "0"
  platform_product_code:
    type: string
    strip_chars: [" ", "\t", "'"]
    trim: true

metric_semantics:
  gmv_basis: paid
  gmv_includes_shipping: false
  gmv_includes_tax: false
  refund_handling: separate
  net_amount_formula: "gmv - refund_amount"
  timezone: Asia/Shanghai
  grain: sku_day
  # 平台扣点比例（0.05 = 5%）。0 = 利润不含扣点；天猫常见 2%~5%，按经营类目实填
  platform_fee_rate: 0
  # 单件履约成本（快递 + 包材，元/件）。0 = 不计入利润
  fulfillment_cost_per_unit: 0

row_filters:
  - column: stat_date
    op: not_null
  - column: gmv
    op: numeric
  - column: product_name
    op: not_contains
    values: ["测试", "赠品"]

dedup:
  enabled: true
  keys: [stat_date, platform_key, platform_product_code, shop_code]
  strategy: sum
